project_name: committer

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^makefile:'
      - '^testing:'

builds:
  - env: 
      - CGO_ENABLED=0
    flags:
      # - `trimpath` removes absolute path in the trace.
      - -trimpath
    ldflags:
      # - w: No DWARF (reduces binary size)
      # - s: No symbol table (even less binary size)
      - -s -w

      # - `znow` and `zrelro`: Hardening (SEE: https://red.ht/3CQ43Zg)
      - -extldflags '-zrelro'
      - -extldflags '-znow'

      # Creates static binaries (SEE: https://bit.ly/3CoBQr7)
      - -extldflags '-static'

      - -X github.com/thalesfsp/committer/internal/version.buildCommit={{.FullCommit}}
      - -X github.com/thalesfsp/committer/internal/version.buildVersion={{.Version}}
      - -X github.com/thalesfsp/committer/internal/version.buildTime={{.CommitDate}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "6"
      - "7"

source:
  enabled: true

# Keyless signing with cosign v3: service URLs (issuer, Fulcio, Rekor) come
# from cosign's signing config, so none are passed explicitly, and each
# artifact gets a self-contained Sigstore bundle that `cosign verify-blob
# --bundle` consumes.
# SEE: https://docs.sigstore.dev/cosign/signing/signing_with_blobs/
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--yes", "--bundle=${signature}", "${artifact}"]
    artifacts: all

checksum:
  name_template: "checksums"
